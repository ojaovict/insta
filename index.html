<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insta2000</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="web">
      <figure class="logo">
        <img src="insta.png" alt="Logo do Instagram" width="50" />
      </figure>

      <div class="botoes-container">
        <button class="botoes">Entrar</button>
        <button class="botoes">Minecraft</button>
      </div>

      <hr />

      <div id="conteudo">
        <div id="cabecalho">
          <div id="fotodeperfil">
            <img
              id="perfil"
              src="perfil.jpeg"
              alt="Foto de perfil"
              width="200"
            />
          </div>

          <div id="textodeperfil">
            <h2>Jornellio</h2>

            <p><b>15</b> seguidores <b>9</b> seguindo</p>

            <p>
              <strong>> Digital College • Fortaleza/CE _</strong>
            </p>

            <p class="juntinhos" id="essenao">
              <span id="pill">
                <a
                  target="_blank"
                  href="https://youtu.be/Uoox9fpmDP0?si=nGefAu8YrIQHugi7"
                >
                  <img src="emoji.png" alt="musica" height="16" />

                  my fav music
                </a>
              </span>
            </p>

            <p class="juntinhos">| Nothing escapes the currents of time.</p>
            <p class="juntinhos">| Beginner Developer</p>
            <p class="juntinhos">19y</p>
            

            <a href="https://github.com/ojaovict">
              <i id="icon"></i>
              <img src="github.png" alt="githubol" width="15">
              my github
            </a>
          </div>
        </div>

        <div id="destaques">
          <div class="destaque">
            <img src="destaque1.jpeg" alt="Imagem de destaque" />
            <p>Destaque 1</p>
          </div>

          <div class="destaque">
            <img src="destauque2.jpeg" alt="Imagem de destaque" />
            <p>Destaque 2</p>
          </div>

          <div class="destaque">
            <img src="destauque2.jpeg" alt="Imagem de destaque" />
            <p>Destaque 3</p>
          </div>

          <div class="destaque">
            <img src="destaque3.jpeg" alt="Imagem de destaque" />
            <p>Destaque 4</p>
          </div>
        </div>

        <div id="feed">
          <div class="post">
            <img src="feed1.jpeg" alt="Post do Instagram" />
          </div>

          <div class="post">
            <img src="feed2.jpeg" alt="Post do Instagram" />
          </div>

          <div class="post">
            <img src="feed3.jpeg" alt="Post do Instagram" />
          </div>

          <div class="post">
            <img src="feed2.jpeg" alt="Post do Instagram" />
          </div>

          <div class="post">
            <img src="feed3.jpeg" alt="Post do Instagram" />
          </div>
          <div class="post">
            <img src="feed1.jpeg" alt="Post do Instagram" />
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
